<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for an IRONCORE FITNESS membership.">
    <title>IRONCORE FITNESS | Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header class="nav-header">
        <a href="index.html" class="site-name">IRONCORE</a>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="media.html">Media</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="form-page">
        <section class="intro">
            <h1>Become a Member</h1>
            <p>Fill in the form below to join IRONCORE FITNESS. Fields marked with * are required.</p>
        </section>

        <form class="reg-form" action="#" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Personal Details</legend>

                <div class="field">
                    <label for="fullname" class="required">Full name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="e.g. Ali Khan" required minlength="3" maxlength="40">
                </div>

                <div class="field">
                    <label for="email" class="required">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password" class="required">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="20">
                </div>

                <div class="field">
                    <label for="dob" class="required">Date of birth</label>
                    <input type="date" id="dob" name="dob" required min="1940-01-01" max="2010-12-31">
                </div>

                <div class="field">
                    <label for="website">Social / website URL</label>
                    <input type="url" id="website" name="website" placeholder="https://instagram.com/you">
                </div>

                <div class="field">
                    <label for="memberid">Member ID (assigned)</label>
                    <input type="text" id="memberid" name="memberid" value="IC-2026-NEW" readonly>
                </div>

                <div class="field">
                    <label for="branch">Branch</label>
                    <input type="text" id="branch" name="branch" value="Main Branch (only option)" disabled>
                </div>
            </fieldset>

            <fieldset>
                <legend>Fitness Profile</legend>

                <div class="field">
                    <label for="age" class="required">Age</label>
                    <input type="number" id="age" name="age" min="16" max="80" required>
                </div>

                <div class="field">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" name="weight" min="30" max="250" step="0.5">
                </div>

                <div class="field">
                    <label for="intensity">Preferred intensity (1&ndash;10)</label>
                    <input type="range" id="intensity" name="intensity" min="1" max="10" value="5">
                </div>

                <div class="field">
                    <label for="trainTime">Preferred training time</label>
                    <input type="time" id="trainTime" name="trainTime" min="06:00" max="22:00">
                </div>

                <div class="field">
                    <label for="kitColour">Favourite kit colour</label>
                    <input type="color" id="kitColour" name="kitColour" value="#a3e635">
                </div>

                <div class="field">
                    <label for="plan" class="required">Membership plan</label>
                    <select id="plan" name="plan" required>
                        <option value="">-- Choose a plan --</option>
                        <option value="basic">Basic &ndash; Rs 5,000 / month</option>
                        <option value="pro" selected>Pro &ndash; Rs 8,000 / month</option>
                        <option value="elite">Elite &ndash; Rs 12,000 / month</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Preferences</legend>

                <div class="field">
                    <span class="group-label">Gender</span>
                    <div class="options">
                        <input type="radio" id="male" name="gender" value="male" checked>
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Prefer not to say</label>
                    </div>
                </div>

                <div class="field">
                    <span class="group-label">Interests</span>
                    <div class="options">
                        <input type="checkbox" id="strength" name="interests" value="strength" checked>
                        <label for="strength">Strength</label>
                        <input type="checkbox" id="cardio" name="interests" value="cardio">
                        <label for="cardio">Cardio</label>
                        <input type="checkbox" id="yoga" name="interests" value="yoga">
                        <label for="yoga">Yoga</label>
                        <input type="checkbox" id="boxing" name="interests" value="boxing" disabled>
                        <label for="boxing">Boxing (coming soon)</label>
                    </div>
                </div>

                <div class="field">
                    <label for="photo">Profile photo</label>
                    <input type="file" id="photo" name="photo" accept="image/*">
                </div>

                <div class="field">
                    <label for="goals">Your fitness goals</label>
                    <textarea id="goals" name="goals" rows="4" maxlength="300" placeholder="Tell us what you want to achieve..."></textarea>
                </div>

                <div class="field">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms" class="required">I agree to the gym rules</label>
                </div>
            </fieldset>

            <div class="actions">
                <button type="submit">Register</button>
                <button type="reset" class="secondary">Clear</button>
            </div>
        </form>
    </main>

    <footer class="page-footer">
        <p>&copy; 2026 IRONCORE FITNESS</p>
    </footer>
</body>
</html>
